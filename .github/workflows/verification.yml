# ============================================================
#  VÉRIFICATION AUTOMATIQUE — Gestion-OP
# ============================================================
#
#  À chaque envoi de code sur GitHub, et à chaque demande de fusion,
#  ce processus relance TOUTE la suite de tests et vérifie que
#  l'application compile. Le résultat s'affiche sur GitHub : une coche
#  verte, ou une croix rouge qui dit précisément ce qui a cassé.
#
#  POURQUOI : jusqu'ici, rien ne lançait les tests automatiquement. Ils
#  ne tournaient que lorsqu'on pensait à les lancer. Un code cassé
#  pouvait donc partir en production sans que rien ne le signale.
#
#  CE QUE ÇA ATTRAPE : les régressions — ce qui marchait et ne marche
#  plus. Pas les angles morts : un défaut qu'aucun test ne couvre passe
#  au vert. Ce processus garantit qu'on ne casse pas l'existant, il ne
#  garantit pas l'absence de défaut.
#
#  AUCUNE CLÉ N'EST NÉCESSAIRE ICI. Les clés Firebase et Supabase ne
#  servent qu'à l'exécution, pas à la compilation : l'application se
#  compile sans elles. Rien de secret n'a donc à être confié à GitHub
#  pour cette vérification.
#
#  L'application vit dans le sous-dossier gestion-op/ : toutes les
#  commandes s'exécutent là, d'où le « working-directory ».
# ============================================================

name: Vérification

on:
  push:
    branches: [main, dev-test, essai-supabase]
  pull_request:
  # Permet aussi de relancer la vérification à la main depuis GitHub,
  # sans avoir à pousser un commit pour cela.
  workflow_dispatch:

jobs:
  tests:
    name: Tests et compilation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gestion-op

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Garde les paquets d'une exécution à l'autre : sans ce cache,
          # chaque vérification réinstalle tout depuis zéro.
          cache: npm
          cache-dependency-path: gestion-op/package-lock.json

      # npm ci, et non npm install : il installe EXACTEMENT les versions
      # du fichier package-lock.json. Une vérification doit porter sur les
      # mêmes paquets que ceux du poste de travail, sinon elle ne prouve
      # rien de ce qui partira en production.
      - name: Installer les dépendances
        run: npm ci

      # CI=true fait deux choses : les tests s'exécutent une fois et
      # rendent la main (au lieu de rester en surveillance), et les
      # avertissements de compilation deviennent des erreurs.
      - name: Lancer la suite de tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Vérifier que l'application compile
        run: npm run build
        env:
          CI: true
