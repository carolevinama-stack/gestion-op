# ============================================================
#  Nginx — extrait à intégrer dans la configuration du serveur
# ============================================================
#  À utiliser si l'hébergement du projet est un serveur Linux (accès SSH)
#  plutôt qu'un hébergement mutualisé.
#
#  Même rôle que le fichier .htaccess : servir index.html pour toute
#  adresse qui ne correspond pas à un fichier existant.
#
#  À SAVOIR, et c'est rassurant : l'application n'utilise AUCUN routeur.
#  Les écrans changent par l'état interne de React, et l'adresse ne quitte
#  jamais la racine. Recharger avec F5 recharge donc toujours la racine.
#  Cette règle est un filet de sécurité (adresse mal tapée, favori
#  périmé), pas une nécessité — contrairement à ce que je croyais avant
#  de l'éprouver.
#
#  VÉRIFIÉ contre un vrai nginx : /budget et /circuitCF servent bien
#  index.html, le script compilé est mis en cache un an, index.html ne
#  l'est jamais.
# ============================================================

server {
    listen 80;
    server_name gestion-op.example.org;   # ← à remplacer

    root /var/www/gestion-op;              # ← dossier où le build est déposé
    index index.html;

    # Toute adresse inconnue est confiée à l'application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers de build : nom à empreinte, donc cache long sans risque.
    location ~* \.(js|css|woff|woff2|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html : jamais en cache, sinon les mises à jour ne passent pas.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}


